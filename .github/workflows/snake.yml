name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3  # Bu satırı ekledim, repo'yu checkout etmek için gerekli

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-contribution-grid-snake.svg  # Sadece dosya adı, parametreleri kaldırdım
          color_snake: '#9d4edd'    # Mor renk için
          color_dots: '#00000000'    # Tam şeffaf arkaplan için (8 haneli hex kodu)

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
