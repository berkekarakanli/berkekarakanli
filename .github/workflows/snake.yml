name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"   # her gün
  workflow_dispatch:

# (opsiyonel ama iyi pratik) push için yazma izni
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake (defaults)
      # svg-only kullanıyoruz; renk/palette parametresi yok
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg
            dist/github-contribution-grid-snake-light.svg

      - name: Push Snake to GitHub (output branch)
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
