name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"   # her gün
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate Snake (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_bg=%23000000&color_snake=%23000000&color_dots=%23008400,%2300a000,%2300c853,%2322c55e,%2334d399
            dist/snake-light.svg?color_bg=%23ffffff&color_snake=%23000000&color_dots=%23008400,%2300a000,%2300c853,%2322c55e,%2334d399

      - name: Push Snake to GitHub
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
